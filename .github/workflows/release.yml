name: release pipeline
on:
  push:
    branches:
      - main

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true  
      
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - name : checkout repository - test
        uses: actions/checkout@v4
      - name: setup python - test
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install dependencies - test
        run: python -m pip install -r requirements.txt
      - name: run pytest - test
        run: python -m pytest      
  build:
    runs-on: ubuntu-latest
    needs: [test]
    timeout-minutes: 10
    steps:
      - name : checkout repository - build
        uses: actions/checkout@v4
      - name: setup python - build
        uses: actions/setup-python@v5
        with:
          python-version: 3.12
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install dependencies - build
        run: python -m pip install -r requirements.txt
      - name: reading the version from version file
        id: version
        run: |
          VERSION="$(cat VERSION)"
          echo "version=${VERSION} > "$GITHUB_OUTPUT"
      - name: build release tarbal
        run: |
          chmod +x build.sh        
          ./build.sh
      - name: upload the release artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ steps.version.outputs.version }}
          path: dist/*.tar.gz
          if-no-files-found: error
